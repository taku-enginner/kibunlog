services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kibunrogu
    ports:
      - "23306:3306"
    volumes:
      - db_data_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "28000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: kibunrogu
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "23000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:28000
      NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: REMOVED_API_KEY
    depends_on:
      - backend

volumes:
  db_data_local:
