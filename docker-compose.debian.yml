services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kibunrogu
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: kibunrogu
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # 公開ドメイン経由でアクセスされる前提に統一。
      # Tailscale 経由 (debian.tail69d614.ts.net:8443) でアクセスしたときは
      # Caddy がパス振り分けで backend に流すので、ブラウザから見える出元と
      # API ベースが食い違ってもよい (同一オリジン扱いではないが動作する)。
      NUXT_PUBLIC_API_BASE: https://${PUBLIC_DOMAIN}
      NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    depends_on:
      - backend

  caddy:
    image: caddy:2
    ports:
      - "8443:443"
      # Cloudflare Tunnel から平文 HTTP で受ける口。Tunnel が TLS 終端する。
      # ホストの 8080 は shutdown-api が使用中なので 8081 を使う。
      - "127.0.0.1:8081:80"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  caddy_data:
  uploads_data:
