services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kibunrogu
    ports:
      - "3306:3306"
    volumes:
      - db_data_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: kibunrogu
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend

  e2e:
    build:
      context: ./scripts
      dockerfile: Dockerfile.e2e
    environment:
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8000
    depends_on:
      - frontend
      - backend
    profiles:
      - test

volumes:
  db_data_local:
  uploads_data:
